[package]
name = "hjworker"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.6.1", features = ["d1"] }
worker-macros = "0.6.1"
console_error_panic_hook = "0.1.7"
reqwest = { version = "0.12.22", default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1.0.219", features = ["derive"] }
wasm-bindgen = "0.2.100"
frankenstein = { version = "0.44", features = ["client-reqwest"] }

hjcommon = { path = "../common" }
cloudflare = "0.14.0"
console_log = "1.0.0"
log = "0.4.27"
hjweb = { path = "../web" }
