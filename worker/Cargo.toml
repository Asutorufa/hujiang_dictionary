[package]
name = "hjworker"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
frankenstein = { workspace = true }
log = { workspace = true }
cloudflare = { workspace = true }
worker = { workspace = true }
worker-macros = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = "^0.3"
getrandom = { version = "0.4" }

hjcommon = { path = "../common" }
d1-orm = { version = "0.1.1", features = ["d1"] }
async-trait = "0.1.89"
futures-util = "0.3"
bytes = "1.0"
hj_ai = { path = "../ai", features = ["worker"] }
