name = "hj-rust"
main = "worker/build/worker/shim.mjs"
compatibility_date = "2023-03-22"

[build]
command = "worker-build --release"
cwd = "worker"

[vars]
TELEGRAM_TOKEN = ""
ALLOW_USERS = ""
MAINTAINER_ID = ""  # send random word to the chat id when cron job run

[ai]
binding = "AI"

[observability.logs]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = ""
database_id = ""

[triggers]
crons = ["*/20 0-15 * * *"] # UTC timezone

[placement]
mode = "smart"

[assets]
directory = "./web/out"
binding = "ASSETS"
