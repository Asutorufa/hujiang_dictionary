[package]
name = "hj-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = "0.29.0"
aws_lambda_events = "0.17.0"
base64 = "0.22.1"
ego-tree = "0.10.0"
futures = "0.3.31"
html2text = "0.15.3"
html5ever = "0.35.0"
lambda_runtime = "0.14.3"
reqwest = { version = "0.12.22", default-features = false, features = [
    "rustls-tls",
] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
teloxide = { version = "0.17.0", default-features = false, features = [
    "macros",
    "rustls",
    "ctrlc_handler",
] }
teloxide-macros = "0.10.0"
tokio = { version = "1", features = ["full"] }
url = "2.5.4"
value2struct = { path = "./value2struct" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary*
