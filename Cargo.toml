[package]
name = "dictdeck"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["dict", "worker", "web", "gemini", "ai", "value2struct"]

[dependencies]
log = { workspace = true }
tokio = { workspace = true }
env_logger = { workspace = true }
hjdict = { path = "./dict" }


[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.33"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "query",
] }
frankenstein = { version = "0.50.1", default-features = false, features = ["trait-async"] }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
env_logger = "0.11.11"
cloudflare = { version = "0.14.0", default-features = false, features = [
    "rustls-tls",
] }
scraper = "0.27.0"
ego-tree = "0.11.0"
html2text = { version = "0.17.1", default-features = false }
dom_smoothie = { version = "0.18.0", features = ["aho-corasick"] }
rust-embed = "8.11.0"
worker = { version = "=0.8.6", features = ["d1"] }
worker-macros = "=0.8.6"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["console"] }
url = "2.5.8"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
panic = 'abort'   # Abort on panic
# Keep the wasm externref table required by wasm-bindgen catch wrappers.
strip = "debuginfo"
