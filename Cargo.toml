[package]
name = "hj-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = "0.29.0"
html2text = "0.15.3"
reqwest = { version = "0.12.22" }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
teloxide = { version = "0.17.0", default-features = false, features = [
    "macros",
    "rustls",
    "ctrlc_handler",
] }
teloxide-macros = "0.10.0"
tokio = { version = "1", features = ["full"] }
value2struct = { path = "./value2struct" }
