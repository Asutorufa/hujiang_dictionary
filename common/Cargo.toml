[package]
name = "hjcommon"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
value2struct = { path = "../value2struct" }
serde_json = "1.0.141"
reqwest = { version = "0.12.22", default-features = false }
frankenstein = { version = "0.44", features = ["client-reqwest"] }
log = "0.4.27"
hjdict = { path = "../dict" }

# test only
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
