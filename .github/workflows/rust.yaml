name: build rust musl ci

on:
  push:
    branches: [ "rust" ]
    tags: [v*]
  pull_request:
    branches: [ "rust" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies and lint frontend
        run: |
          cd web
          npm ci --legacy-peer-deps
          npm run lint
          npx tsc --noEmit
          npx prettier --check .

      - name: Lint fix frontend
        if: failure() && github.event_name == 'push' && github.ref_name == 'rust'
        run: |
          cd web
          npm run lint:fix
          npx prettier --write .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Create dummy web assets
        run: mkdir -p web/out && touch web/out/index.html

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run fmt check
        run: cargo fmt --all --check

      - name: Run clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Auto fix
        if: failure() && github.event_name == 'push' && github.ref_name == 'rust'
        run: |
          cargo fmt --all
          cargo clippy --fix --allow-dirty --all-targets --all-features -- -D warnings || true

      - name: Create Pull Request
        if: failure() && github.event_name == 'push' && github.ref_name == 'rust'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: fix linting issues"
          title: "chore: fix linting issues"
          body: |
            Automated fix for linting issues.
            - frontend lint fix & prettier
            - cargo fmt
            - cargo clippy --fix
          branch: lint-fix
          base: rust
          delete-branch: true

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci --legacy-peer-deps
          npm run build

      - name: Cache Web
        id: cache-web
        uses: actions/cache@v5
        with:
          path: web/out
          key: cache-web-${{ github.sha }}

  worker:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Web Cache
        uses: actions/cache@v5
        with:
          path: web/out
          key: cache-web-${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install worker-build
        run: cargo install worker-build

      - name: Build Worker
        run: npx wrangler build

  build:
    needs: web
    name: Build - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - os-name: Linux-aarch64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-musl

          - os-name: Linux-riscv64
            runs-on: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

          - os-name: Windows-aarch64
            runs-on: windows-latest
            target: aarch64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

          - os-name: android-x86_64
            runs-on: ubuntu-latest
            target: x86_64-linux-android

          - os-name: android-aarch64
            runs-on: ubuntu-latest
            target: aarch64-linux-android

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Web Cache
        uses: actions/cache@v5
        with:
          path: web/out
          key: cache-web-${{ github.sha }}

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--locked --release"
          strip: true
          cross-version: "e281947ca900da425e4ecea7483cfde646c8a1ea"
    
      - id: rename-binary-name
        run: |
         cp target/${{ matrix.platform.target }}/release/lambda${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }} lambda-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
         cp target/${{ matrix.platform.target }}/release/tg${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }} tg-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
         cp target/${{ matrix.platform.target }}/release/hj${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }} hj-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}

      - name: lambda-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v7
        with:
          name: lambda-${{ matrix.platform.target }}
          path: lambda-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
      - name: tg-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v7
        with:
          name: tg-${{ matrix.platform.target }}
          path: tg-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
      - name: hj-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v7
        with:
          name: hj-${{ matrix.platform.target }}
          path: hj-${{ matrix.platform.target }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}

  release:
    if: github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'rust')
    needs: 
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - id: generate-release-notes
        run: |
          echo "## Release Notes" > release_notes.txt
          echo "" >> release_notes.txt
          bash .github/release_note >> release_notes.txt

      - name: download_artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.txt
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'draft release' }}
          draft: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          # see: https://github.com/softprops/action-gh-release/issues/79#issuecomment-930339070
          files: |
            release_notes.txt
            artifacts/*/*
