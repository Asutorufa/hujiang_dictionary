name: build rust musl ci

on:
  push:
    branches: [ "rust" ]
  pull_request:
    branches: [ "rust" ]

jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl

          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl

          - os-name: Linux-riscv64
            runs-on: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

          - os-name: Windows-aarch64
            runs-on: windows-latest
            target: aarch64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--locked --release"
          strip: true
      - name: lambda-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/lambda${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
      - name: tg-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v4
        with:
          name: tg-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/tg${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
      - name: hj-${{ matrix.platform.target }}
        uses: actions/upload-artifact@v4
        with:
          name: hj-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/hj${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}

